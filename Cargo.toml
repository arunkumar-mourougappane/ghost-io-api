[package]
name = "ghost-io-api"
version = "0.1.0"
edition = "2021"

[dependencies]
thiserror = "1.0"
reqwest = { version = "0.12", features = ["json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }

[features]
integration-tests = []
